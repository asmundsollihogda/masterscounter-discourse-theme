<script>
// === Theme string localization ===
// Discourse sets <html lang> per visitor (site locale, user preference, or
// Accept-Language). Core UI translates itself; these are our own strings.
// English lives in the markup/code as the fallback.
var MC_I18N = {
  ja: {
    welcome_banner: '初めての方へ：コミュニティマネージャーよりウェルカムメッセージをお届けします！',
    hero_desc: '鮨を技と文化として探求し、知識や経験を分かち合い、技術を磨く。鮨を愛する方とプロフェッショナルのためのコミュニティです。',
    read_more: '詳しく見る',
    search_placeholder: 'トピックを検索…',
    register: '登録',
    nav_courses: 'コース',
    nav_account: 'アカウント',
    categories: 'カテゴリ',
    community_activity: 'アクティビティ',
    tab_latest: '最新',
    tab_unread: '未読',
    tab_unanswered: '未回答',
    th_topic: 'トピック',
    th_replies: '返信',
    th_views: '閲覧',
    th_activity: 'アクティビティ',
    topics_count: 'トピック数: ',
    latest_prefix: '最新: ',
    top_contributors: 'トップ投稿者',
    posts_label: '投稿',
    see_all: 'すべて見る',
    no_topics: 'トピックはまだありません',
    home: 'ホーム',
    page_all_activity: 'すべてのアクティビティ',
    page_new: '新着',
    page_unread: '未読',
    page_categories: 'カテゴリ',
    cta_text: '質問や経験をみんなと共有してみませんか？',
    cta_button: '新しいトピックを作成',
    footer_courses: 'コース',
    footer_community: 'コミュニティ',
    footer_about: 'インフォメーション',
    footer_legal: '法的情報',
    footer_categories: 'カテゴリ',
    footer_latest: '最新',
    footer_terms: '利用規約',
    footer_privacy: 'プライバシーポリシー',
    footer_refund: '返金ポリシー',
    min_suffix: '分',
    hour_suffix: '時間',
    day_suffix: '日'
  }
};

function mcLocale() {
  var lang = (document.documentElement.lang || '').toLowerCase();
  return lang.indexOf('ja') === 0 ? 'ja' : 'en';
}

function mcT(key, fallback) {
  var dict = MC_I18N[mcLocale()];
  return (dict && dict[key]) || fallback;
}

// Translate static theme HTML (hero, welcome banner, CTA, footer) via
// data-mc-t / data-mc-t-placeholder attributes. Idempotent.
function mcApplyStaticI18n() {
  if (mcLocale() === 'en') return;
  document.querySelectorAll('[data-mc-t]').forEach(function(el) {
    if (el.dataset.mcTDone) return;
    var t = mcT(el.dataset.mcT, null);
    if (t) { el.textContent = t; el.dataset.mcTDone = '1'; }
  });
  document.querySelectorAll('[data-mc-t-placeholder]').forEach(function(el) {
    if (el.dataset.mcTDone) return;
    var t = mcT(el.dataset.mcTPlaceholder, null);
    if (t) { el.setAttribute('placeholder', t); el.dataset.mcTDone = '1'; }
  });
}
document.addEventListener('DOMContentLoaded', function() {
  mcApplyStaticI18n();
  new MutationObserver(mcApplyStaticI18n).observe(document.body, { childList: true, subtree: true });
});

// Main site nav links — top bar on desktop, slide-in menu (sidenav) on mobile
var MC_NAV_LINKS = [
  { key: 'nav_courses', text: 'Courses', href: 'https://masterscounter.com/courses' },
  { key: 'nav_account', text: 'Account', href: 'https://masterscounter.com/account', authRequired: true }
];

// The 'anon' body class disappeared in the 2026 Discourse upgrade, and
// data-preloaded is emptied after boot — the rendered header is the only
// reliable auth signal: anon shows a login button, logged-in shows #current-user.
function mcAuthKnown() {
  return !!(document.getElementById('current-user') ||
            document.querySelector('.d-header .auth-buttons .login-button'));
}
function mcIsAnon() {
  return !document.getElementById('current-user');
}

function mcBuildNavLinks(navClass, linkClass) {
  var isAnon = mcIsAnon();
  var nav = document.createElement('div');
  nav.className = navClass;
  MC_NAV_LINKS.forEach(function(link) {
    if (link.authRequired && isAnon) return;
    var a = document.createElement('a');
    a.className = linkClass;
    a.href = link.href;
    a.textContent = mcT(link.key, link.text);
    nav.appendChild(a);
  });
  return nav;
}

function addHeaderLinks() {
  if (!mcAuthKnown()) return; // wait until auth state has rendered
  var panel = document.querySelector('.d-header .panel');
  if (panel && !document.querySelector('.mc-header-nav')) {
    panel.prepend(mcBuildNavLinks('mc-header-nav', 'mc-header-link'));
  }
}

// Inject the same links at the top of the mobile slide-in menu
function addSidenavLinks() {
  if (!mcAuthKnown()) return;
  var panel = document.querySelector('.menu-panel .panel-body-contents');
  if (panel && !panel.querySelector('.mc-sidenav-links')) {
    panel.prepend(mcBuildNavLinks('mc-sidenav-links', 'mc-sidenav-link'));
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var observer = new MutationObserver(function() {
    addHeaderLinks();
    addSidenavLinks();
    addRegisterButton();
  });
  observer.observe(document.body, { childList: true, subtree: true });
  addHeaderLinks();
  addSidenavLinks();
  addRegisterButton();
});

// Add Register button left of Log In for logged-out users
function addRegisterButton() {
  var authButtons = document.querySelector('.d-header .auth-buttons');
  if (!authButtons || authButtons.querySelector('.mc-register-button')) return;
  var loginBtn = authButtons.querySelector('.login-button');
  if (!loginBtn) return;
  var btn = document.createElement('button');
  btn.className = 'btn btn-primary mc-register-button';
  btn.type = 'button';
  btn.textContent = mcT('register', 'Register');
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    loginBtn.click();
  });
  authButtons.insertBefore(btn, loginBtn);
}

// Close sidebar on clicking outside
document.addEventListener('click', function(e) {
  var body = document.body;
  if (!body.classList.contains('has-sidebar-page')) return;
  var sidebar = document.querySelector('.sidebar-wrapper');
  if (sidebar && !sidebar.contains(e.target) && !e.target.closest('.header-sidebar-toggle')) {
    var toggleBtn = document.querySelector('.header-sidebar-toggle button');
    if (toggleBtn) toggleBtn.click();
  }
});

// Move hamburger to far left of header on mobile
function moveHamburger() {
  if (window.innerWidth >= 768) return;
  var contents = document.querySelector('.d-header .contents');
  var hamburger = document.querySelector('.d-header .hamburger-dropdown');
  if (contents && hamburger && hamburger.parentElement !== contents) {
    contents.prepend(hamburger);
  }
}
document.addEventListener('DOMContentLoaded', function() {
  var obs = new MutationObserver(moveHamburger);
  obs.observe(document.body, { childList: true, subtree: true });
  moveHamburger();
});

// Move welcome banner and hero banner outside main-outlet-wrapper for full-width
document.addEventListener('DOMContentLoaded', function() {
  var observer = new MutationObserver(function() {
    var banner = document.querySelector('.custom-banner');
    var welcomeBanner = document.querySelector('.mc-welcome-banner');
    var homepage = document.querySelector('#mc-custom-homepage');
    var header = document.querySelector('.d-header-wrap');
    if (banner && header && banner.closest('#main-outlet-wrapper')) {
      if (welcomeBanner) header.after(welcomeBanner);
      var insertAfter = welcomeBanner || header;
      insertAfter.after(banner);
      if (homepage) banner.after(homepage);
      observer.disconnect();

      // Hide homepage elements if not on homepage
      if (!mcIsHomepage()) {
        banner.style.display = 'none';
        if (welcomeBanner) welcomeBanner.style.display = 'none';
        if (homepage) homepage.style.display = 'none';
      }
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
});

// Dismiss welcome banner — check localStorage + wire up close button
document.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('mc-welcome-dismissed') === '1') {
    var wb = document.getElementById('mc-welcome-banner');
    if (wb) wb.style.display = 'none';
  }

  function wireDismiss() {
    var btn = document.getElementById('mc-welcome-dismiss');
    if (btn && !btn._wired) {
      btn._wired = true;
      btn.addEventListener('click', function() {
        var banner = document.getElementById('mc-welcome-banner');
        if (banner) banner.style.display = 'none';
        localStorage.setItem('mc-welcome-dismissed', '1');
      });
    }
  }
  wireDismiss();
  var dismissObs = new MutationObserver(wireDismiss);
  dismissObs.observe(document.body, { childList: true, subtree: true });
});

// === Custom Homepage Builder ===
// Hides default Discourse categories on homepage and builds custom layout
// with: Featured Topics, Categories + Community Activity, Top Contributors

var MC_HIDDEN_CATEGORIES = ['paid-members', 'admin'];

function mcIsHomepage() {
  var path = window.location.pathname;
  return path === '/' || path === '/categories';
}

function mcTimeAgo(dateStr) {
  var diff = Date.now() - new Date(dateStr).getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 60) return mins + mcT('min_suffix', 'm');
  var hours = Math.floor(mins / 60);
  if (hours < 24) return hours + mcT('hour_suffix', 'h');
  var days = Math.floor(hours / 24);
  return days + mcT('day_suffix', 'd');
}

function mcBuildFeaturedTopics(topics) {
  if (!topics || topics.length === 0) return '';
  var cards = topics.slice(0, 3).map(function(t) {
    var imageUrl = t.image_url || '';
    var imageHtml = imageUrl
      ? '<div class="mc-featured__img" style="background-image:url(' + imageUrl + ')"></div>'
      : '<div class="mc-featured__img mc-featured__img--empty"></div>';
    return '<a href="/t/' + t.slug + '/' + t.id + '" class="mc-featured__card">' +
      imageHtml +
      '<div class="mc-featured__title">' + t.title + '</div>' +
    '</a>';
  }).join('');

  return '<div class="mc-featured">' +
    '<div class="mc-featured__grid">' + cards + '</div>' +
  '</div>';
}

function mcBuildCategories(categories) {
  var filtered = categories.filter(function(c) {
    return MC_HIDDEN_CATEGORIES.indexOf(c.slug) === -1;
  });

  var items = filtered.map(function(c) {
    var latestTitle = '';
    if (c.topic_list && c.topic_list.topics && c.topic_list.topics[0]) {
      latestTitle = c.topic_list.topics[0].title;
    }
    return '<a href="/c/' + c.slug + '/' + c.id + '" class="mc-categories__item">' +
      '<div class="mc-categories__name">' + c.name + '</div>' +
      '<div class="mc-categories__count">' + mcT('topics_count', 'Topics: ') + c.topic_count + '</div>' +
      (latestTitle ? '<div class="mc-categories__latest">' + mcT('latest_prefix', 'Latest: ') + '<strong>' + latestTitle + '</strong></div>' : '') +
    '</a>';
  }).join('');

  return '<div class="mc-categories">' +
    '<h2 class="mc-section-title">' + mcT('categories', 'Categories') + '</h2>' +
    items +
  '</div>';
}

function mcBuildActivity(topics, users) {
  var userMap = {};
  if (users) {
    users.forEach(function(u) { userMap[u.id] = u; });
  }

  var rows = topics.slice(0, 6).map(function(t) {
    var categoryName = '';
    if (t.category_id && window._mcCategories) {
      var cat = window._mcCategories.find(function(c) { return c.id === t.category_id; });
      if (cat) categoryName = cat.name;
    }
    return '<tr>' +
      '<td class="mc-activity__topic">' +
        '<a href="/t/' + t.slug + '/' + t.id + '">' + t.title + '</a>' +
        (categoryName ? '<div class="mc-activity__cat">' + categoryName + '</div>' : '') +
      '</td>' +
      '<td class="mc-activity__num">' + (t.posts_count - 1) + '</td>' +
      '<td class="mc-activity__num">' + t.views + '</td>' +
      '<td class="mc-activity__num">' + mcTimeAgo(t.last_posted_at || t.created_at) + '</td>' +
    '</tr>';
  }).join('');

  return '<div class="mc-activity">' +
    '<h2 class="mc-section-title">' + mcT('community_activity', 'Community activity') + '</h2>' +
    '<div class="mc-activity__tabs">' +
      '<button class="mc-activity__tab mc-activity__tab--active" data-tab="latest">' + mcT('tab_latest', 'Latest') + '</button>' +
      '<button class="mc-activity__tab" data-tab="unread">' + mcT('tab_unread', 'Unread') + '</button>' +
      '<button class="mc-activity__tab" data-tab="unanswered">' + mcT('tab_unanswered', 'Unanswered') + '</button>' +
    '</div>' +
    '<table class="mc-activity__table">' +
      '<thead><tr>' +
        '<th>' + mcT('th_topic', 'Topic') + '</th><th>' + mcT('th_replies', 'Replies') + '</th><th>' + mcT('th_views', 'Views') + '</th><th>' + mcT('th_activity', 'Activity') + '</th>' +
      '</tr></thead>' +
      '<tbody id="mc-activity-body">' + rows + '</tbody>' +
    '</table>' +
    '<div class="mc-activity__seeall"><a href="/latest">' + mcT('see_all', 'See all') + '</a></div>' +
  '</div>';
}

function mcBuildContributors(directoryItems) {
  // Sort by total contributions (topics started + replies). Discourse's
  // directory_items API returns topic_count and post_count separately and
  // doesn't expose a combined ordering, so we sort client-side.
  var sorted = directoryItems.slice().sort(function(a, b) {
    return ((b.topic_count || 0) + (b.post_count || 0)) -
           ((a.topic_count || 0) + (a.post_count || 0));
  });
  var items = sorted.slice(0, 5).map(function(item) {
    var u = item.user;
    var avatar = u.avatar_template.replace('{size}', '45');
    if (avatar.indexOf('http') !== 0) avatar = window.location.origin + avatar;
    var title = u.title || '';
    var total = (item.topic_count || 0) + (item.post_count || 0);
    return '<div class="mc-contributors__item">' +
      '<img class="mc-contributors__avatar" src="' + avatar + '" alt="' + u.username + '" />' +
      '<div class="mc-contributors__info">' +
        '<div class="mc-contributors__name">' + (u.name || u.username) + '</div>' +
        (title ? '<div class="mc-contributors__rank">' + title + '</div>' : '') +
      '</div>' +
      '<div class="mc-contributors__posts">' +
        '<span class="mc-contributors__posts-num">' + total + '</span>' +
        '<span class="mc-contributors__posts-label">' + mcT('posts_label', 'Posts') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  return '<div class="mc-contributors">' +
    '<h2 class="mc-section-title">' + mcT('top_contributors', 'Top Contributors') + '</h2>' +
    items +
  '</div>';
}

function mcBuildHighlightBox() {
  // Image is painted via CSS background (theme setting `highlight_image`,
  // falling back to the bundled `highlight` asset), so the markup stays empty.
  return '<div class="mc-highlight">' +
    '<div class="mc-highlight__inner"></div>' +
  '</div>';
}

function mcBuildHomepage(data) {
  var container = document.getElementById('mc-custom-homepage');
  if (!container) return;

  var html = '';

  // Featured topics (pinned globally)
  html += mcBuildFeaturedTopics(data.featured);

  // Two-column: Categories + Community Activity
  html += '<div class="mc-two-col">';
  html += mcBuildCategories(data.categories);
  html += mcBuildActivity(data.topics, data.users);
  html += '</div>';

  // Two-column: Top Contributors + Highlight box
  html += '<div class="mc-two-col mc-two-col--bottom">';
  html += mcBuildContributors(data.contributors);
  html += mcBuildHighlightBox();
  html += '</div>';

  container.innerHTML = html;

  // Animate featured cards in sequentially
  var cards = container.querySelectorAll('.mc-featured__card');
  if (cards.length) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    cards.forEach(function(card) { observer.observe(card); });
  }

  // Wire up activity tabs
  var tabs = container.querySelectorAll('.mc-activity__tab');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('mc-activity__tab--active'); });
      tab.classList.add('mc-activity__tab--active');
      mcLoadActivityTab(tab.dataset.tab);
    });
  });
}

function mcLoadActivityTab(tabName) {
  var url = '/latest.json';
  if (tabName === 'unread') url = '/unread.json';

  fetch(url, { headers: { 'Accept': 'application/json' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var topics = data.topic_list ? data.topic_list.topics : [];

      // For "unanswered" tab, filter to topics with no replies
      if (tabName === 'unanswered') {
        topics = topics.filter(function(t) { return t.posts_count <= 1; });
      }

      var userMap = {};
      if (data.users) {
        data.users.forEach(function(u) { userMap[u.id] = u; });
      }

      var rows = topics.slice(0, 6).map(function(t) {
        var categoryName = '';
        if (t.category_id && window._mcCategories) {
          var cat = window._mcCategories.find(function(c) { return c.id === t.category_id; });
          if (cat) categoryName = cat.name;
        }
        return '<tr>' +
          '<td class="mc-activity__topic">' +
            '<a href="/t/' + t.slug + '/' + t.id + '">' + t.title + '</a>' +
            (categoryName ? '<div class="mc-activity__cat">' + categoryName + '</div>' : '') +
          '</td>' +
          '<td class="mc-activity__num">' + (t.posts_count - 1) + '</td>' +
          '<td class="mc-activity__num">' + t.views + '</td>' +
          '<td class="mc-activity__num">' + mcTimeAgo(t.last_posted_at || t.created_at) + '</td>' +
        '</tr>';
      }).join('');

      if (rows === '') {
        rows = '<tr><td colspan="4" class="mc-activity__empty">' + mcT('no_topics', 'No topics yet') + '</td></tr>';
      }

      var tbody = document.getElementById('mc-activity-body');
      if (tbody) tbody.innerHTML = rows;
    });
}

function mcInitHomepage() {
  if (!mcIsHomepage()) return;

  // Hide default Discourse category view
  var mainOutlet = document.querySelector('#main-outlet');
  if (mainOutlet) {
    mainOutlet.classList.add('mc-homepage-active');
  }

  // Show CTA on homepage
  var cta = document.querySelector('.mc-cta');
  if (cta) cta.classList.add('mc-cta--visible');

  // Fetch all data in parallel
  Promise.all([
    fetch('/categories.json', { headers: { 'Accept': 'application/json' } }).then(function(r) { return r.json(); }),
    fetch('/latest.json', { headers: { 'Accept': 'application/json' } }).then(function(r) { return r.json(); }),
    fetch('/directory_items.json?period=all&order=post_count', { headers: { 'Accept': 'application/json' } }).then(function(r) { return r.json(); }),
    fetch('/groups/staff/members.json?limit=100', { headers: { 'Accept': 'application/json' } }).then(function(r) { return r.json(); }).catch(function() { return { members: [], owners: [] }; })
  ]).then(function(results) {
    var categoriesData = results[0];
    var latestData = results[1];
    var directoryData = results[2];
    var staffData = results[3] || {};

    var categories = categoriesData.category_list ? categoriesData.category_list.categories : [];
    window._mcCategories = categories;

    var topics = latestData.topic_list ? latestData.topic_list.topics : [];
    var users = latestData.users || [];

    // Featured = pinned topics
    var featured = topics.filter(function(t) { return t.pinned; });
    // If no pinned topics, use the 3 most recent
    if (featured.length === 0) featured = topics.slice(0, 3);

    // Store featured topic ID → image index mapping
    window._mcFeaturedMap = {};
    featured.slice(0, 3).forEach(function(t, i) {
      window._mcFeaturedMap[t.id] = i + 1;
    });

    // Exclude staff (admins + moderators) from the leaderboard
    var staffIds = {};
    [].concat(staffData.members || [], staffData.owners || []).forEach(function(u) { staffIds[u.id] = true; });
    var contributors = (directoryData.directory_items || []).filter(function(item) {
      return item.user && !staffIds[item.user.id];
    });

    mcBuildHomepage({
      categories: categories,
      topics: topics,
      users: users,
      featured: featured,
      contributors: contributors
    });
  }).catch(function(err) {
    console.error('MC homepage error:', err);
  });
}

// Run on DOMContentLoaded and on Discourse page transitions
document.addEventListener('DOMContentLoaded', function() {
  // Wait for the custom homepage container to be in the DOM
  var initObserver = new MutationObserver(function() {
    if (document.getElementById('mc-custom-homepage')) {
      mcInitHomepage();
      initObserver.disconnect();
    }
  });
  initObserver.observe(document.body, { childList: true, subtree: true });
  // Try immediately too
  mcInitHomepage();
});

// Handle Discourse's client-side navigation (Ember transitions)
(function() {
  var lastPath = window.location.pathname;
  var checkNav = new MutationObserver(function() {
    if (window.location.pathname !== lastPath) {
      lastPath = window.location.pathname;
      // Show/hide homepage elements based on current page
      var banner = document.querySelector('.custom-banner');
      var welcomeBanner = document.querySelector('.mc-welcome-banner');
      var homepage = document.getElementById('mc-custom-homepage');
      var mainOutlet = document.querySelector('#main-outlet');

      var cta = document.querySelector('.mc-cta');
      if (mcIsHomepage()) {
        if (banner) banner.style.display = '';
        if (welcomeBanner && localStorage.getItem('mc-welcome-dismissed') !== '1') welcomeBanner.style.display = '';
        if (homepage) homepage.style.display = '';
        if (cta) cta.classList.add('mc-cta--visible');
        if (mainOutlet) mainOutlet.classList.add('mc-homepage-active');
        mcInitHomepage();
      } else {
        if (banner) banner.style.display = 'none';
        if (welcomeBanner) welcomeBanner.style.display = 'none';
        if (homepage) homepage.style.display = 'none';
        if (cta) cta.classList.remove('mc-cta--visible');
        if (mainOutlet) mainOutlet.classList.remove('mc-homepage-active');
      }
      // Handle topic hero on navigation
      mcBuildTopicHero();
    }
  });
  checkNav.observe(document.body, { childList: true, subtree: true });
})();

// === Topic Page Hero ===
function mcIsTopicPage() {
  return /^\/t\//.test(window.location.pathname);
}

function mcBuildTopicHero() {
  // Only show topic hero on topic pages
  if (!mcIsTopicPage()) {
    var existing = document.getElementById('mc-topic-hero');
    if (existing) existing.remove();
    return;
  }

  // Wait for topic title to be in the DOM
  var titleEl = document.querySelector('#topic-title .fancy-title');
  if (!titleEl) return;

  // Don't re-create if already showing for this topic
  var existing = document.getElementById('mc-topic-hero');
  if (existing && existing.dataset.title === titleEl.textContent) return;
  if (existing) existing.remove();

  var title = titleEl.textContent;
  var categoryBadge = document.querySelector('#topic-title .badge-category__name');
  var category = categoryBadge ? categoryBadge.textContent : '';

  // Build breadcrumb chain (Home › [parent] › [child]) from rendered category badges
  var crumbs = [];
  document.querySelectorAll('#topic-title .badge-category__wrapper').forEach(function(el) {
    var nameEl = el.querySelector('.badge-category__name');
    if (!nameEl) return;
    var href = el.tagName === 'A'
      ? el.getAttribute('href')
      : (el.closest('a') ? el.closest('a').getAttribute('href') : null);
    crumbs.push({ name: nameEl.textContent, href: href });
  });

  // Get topic ID from URL (/t/slug/ID)
  var pathParts = window.location.pathname.split('/');
  var topicId = parseInt(pathParts[3], 10);

  var hero = document.createElement('div');
  hero.id = 'mc-topic-hero';
  hero.dataset.title = title;

  // Check if this topic has a featured image
  if (window._mcFeaturedMap && window._mcFeaturedMap[topicId]) {
    hero.className = 'mc-topic-hero--f' + window._mcFeaturedMap[topicId];
  } else if (!window._mcFeaturedMap) {
    // Direct page load — fetch featured mapping
    fetch('/latest.json', { headers: { 'Accept': 'application/json' } })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var topics = data.topic_list ? data.topic_list.topics : [];
        var feat = topics.filter(function(t) { return t.pinned; });
        if (feat.length === 0) feat = topics.slice(0, 3);
        window._mcFeaturedMap = {};
        feat.slice(0, 3).forEach(function(t, i) {
          window._mcFeaturedMap[t.id] = i + 1;
        });
        if (window._mcFeaturedMap[topicId]) {
          hero.className = 'mc-topic-hero--f' + window._mcFeaturedMap[topicId];
        }
      });
  }

  var crumbHtml = '<a href="/" class="mc-topic-hero__crumb">' + mcT('home', 'Home') + '</a>';
  crumbs.forEach(function(c) {
    crumbHtml += '<span class="mc-topic-hero__crumb-sep">,</span>';
    crumbHtml += c.href
      ? '<a href="' + c.href + '" class="mc-topic-hero__crumb">' + c.name + '</a>'
      : '<span class="mc-topic-hero__crumb">' + c.name + '</span>';
  });

  hero.innerHTML =
    '<div class="mc-topic-hero__content">' +
      (category ? '<span class="mc-topic-hero__cat">' + category + '</span>' : '') +
      '<h1 class="mc-topic-hero__title">' + title + '</h1>' +
      '<nav class="mc-topic-hero__breadcrumb" aria-label="Breadcrumb">' + crumbHtml + '</nav>' +
    '</div>';

  // Insert before main-outlet
  var header = document.querySelector('.d-header-wrap');
  if (header) {
    header.after(hero);
  }

  // Hide the original topic title
  var topicTitle = document.querySelector('#topic-title');
  if (topicTitle) topicTitle.style.display = 'none';
}

var MC_LIST_PAGES = {
  '/latest': { key: 'page_all_activity', text: 'All activity' },
  '/new': { key: 'page_new', text: 'New' },
  '/unread': { key: 'page_unread', text: 'Unread' },
  '/categories': { key: 'page_categories', text: 'Categories' }
};

function mcCurrentListTitle() {
  var path = window.location.pathname.replace(/\/$/, '');
  var entry = MC_LIST_PAGES[path];
  return entry ? mcT(entry.key, entry.text) : null;
}

function mcBuildLatestHero() {
  var title = mcCurrentListTitle();
  var existing = document.getElementById('mc-latest-hero');
  if (!title) {
    if (existing) existing.remove();
    return;
  }
  if (existing && existing.dataset.title === title) return;
  if (existing) existing.remove();

  var crumbHtml =
    '<a href="/" class="mc-topic-hero__crumb">' + mcT('home', 'Home') + '</a>' +
    '<span class="mc-topic-hero__crumb-sep">,</span>' +
    '<span class="mc-topic-hero__crumb">' + title + '</span>';

  var hero = document.createElement('div');
  hero.id = 'mc-latest-hero';
  hero.className = 'mc-page-hero';
  hero.dataset.title = title;
  hero.innerHTML =
    '<div class="mc-topic-hero__content">' +
      '<h1 class="mc-topic-hero__title">' + title + '</h1>' +
      '<nav class="mc-topic-hero__breadcrumb" aria-label="Breadcrumb">' + crumbHtml + '</nav>' +
    '</div>';

  var header = document.querySelector('.d-header-wrap');
  if (header) header.after(hero);
}

function mcEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function mcCategoryIdFromUrl() {
  var match = window.location.pathname.match(/^\/c\/(?:[^\/]+\/)*?(\d+)\/?$/);
  return match ? parseInt(match[1], 10) : null;
}

function mcFindCategory(id) {
  var cats = window._mcCategories || [];
  for (var i = 0; i < cats.length; i++) {
    if (cats[i].id === id) return cats[i];
    var subs = cats[i].subcategory_list || [];
    for (var j = 0; j < subs.length; j++) {
      if (subs[j].id === id) return subs[j];
    }
  }
  return null;
}

function mcFetchCategories() {
  if (window._mcCategoriesPromise) return window._mcCategoriesPromise;
  window._mcCategoriesPromise = fetch('/categories.json', { headers: { 'Accept': 'application/json' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var cats = data.category_list ? data.category_list.categories : [];
      window._mcCategories = cats;
      return cats;
    })
    .catch(function() { return []; });
  return window._mcCategoriesPromise;
}

function mcBuildCategoryHero() {
  var id = mcCategoryIdFromUrl();
  var existing = document.getElementById('mc-category-hero');
  if (!id) {
    if (existing) existing.remove();
    return;
  }
  if (existing && existing.dataset.catId == String(id)) return;

  mcFetchCategories().then(function() {
    var cat = mcFindCategory(id);
    if (!cat) return;
    if (mcCategoryIdFromUrl() !== id) return; // navigated away while fetching
    var prev = document.getElementById('mc-category-hero');
    if (prev) prev.remove();

    var crumbs = [];
    if (cat.parent_category_id) {
      var parent = mcFindCategory(cat.parent_category_id);
      if (parent) crumbs.push({ name: parent.name, href: '/c/' + parent.slug + '/' + parent.id });
    }
    crumbs.push({ name: cat.name, href: null });

    var crumbHtml = '<a href="/" class="mc-topic-hero__crumb">' + mcT('home', 'Home') + '</a>';
    crumbs.forEach(function(c) {
      crumbHtml += '<span class="mc-topic-hero__crumb-sep">,</span>';
      crumbHtml += c.href
        ? '<a href="' + mcEsc(c.href) + '" class="mc-topic-hero__crumb">' + mcEsc(c.name) + '</a>'
        : '<span class="mc-topic-hero__crumb">' + mcEsc(c.name) + '</span>';
    });

    var hero = document.createElement('div');
    hero.id = 'mc-category-hero';
    hero.className = 'mc-page-hero';
    hero.dataset.catId = id;
    hero.innerHTML =
      '<div class="mc-topic-hero__content">' +
        '<h1 class="mc-topic-hero__title">' + mcEsc(cat.name) + '</h1>' +
        (cat.description_text ? '<p class="mc-topic-hero__desc">' + mcEsc(cat.description_text) + '</p>' : '') +
        '<nav class="mc-topic-hero__breadcrumb" aria-label="Breadcrumb">' + crumbHtml + '</nav>' +
      '</div>';

    var header = document.querySelector('.d-header-wrap');
    if (header) header.after(hero);
  });
}

// Force topic links from list/category pages to open at the first post (post #1)
// instead of scrolling to last-read. Mutates href so middle/cmd-click works too.
function mcForceTopOnTopicLinks() {
  if (mcIsTopicPage()) return;
  document.querySelectorAll('a.raw-topic-link, a.title.raw-link').forEach(function(a) {
    if (a.dataset.mcRewritten) return;
    var href = a.getAttribute('href');
    if (!href) return;
    var m = href.match(/^(\/t\/[^\/]+\/\d+)\/?$/);
    if (m) {
      a.setAttribute('href', m[1] + '/1');
      a.dataset.mcRewritten = '1';
    }
  });
}

document.addEventListener('DOMContentLoaded', function() {
  var topicObs = new MutationObserver(function() {
    mcBuildTopicHero();
    mcBuildLatestHero();
    mcBuildCategoryHero();
    mcForceTopOnTopicLinks();
  });
  topicObs.observe(document.body, { childList: true, subtree: true });
  mcBuildTopicHero();
  mcBuildLatestHero();
  mcBuildCategoryHero();
  mcForceTopOnTopicLinks();
});
</script>
